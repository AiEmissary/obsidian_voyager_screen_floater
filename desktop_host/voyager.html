<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Obsidian Voyager</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
      pointer-events: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      pointer-events: none;
    }
    #status {
      position: fixed;
      left: 18px;
      bottom: 18px;
      max-width: 520px;
      padding: 10px 12px;
      border-radius: 10px;
      color: #dff9ff;
      background: rgba(5, 8, 18, 0.55);
      font: 12px/1.35 Segoe UI, Arial, sans-serif;
      letter-spacing: .2px;
      pointer-events: none;
      transition: opacity .8s ease;
    }
    #status.hidden { opacity: 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="status">Preparing Obsidian Voyager…</div>
  <script>
    (async function () {
      const status = document.getElementById('status');
      function setStatus(text, hideSoon) {
        status.textContent = text;
        status.classList.remove('hidden');
        if (hideSoon) setTimeout(() => status.classList.add('hidden'), 4500);
      }

      const cfg = await window.voyagerHost.getConfig();
      const speedMul = Math.max(0.2, Number(cfg.speed || 1));
      const scaleMul = Math.max(0.15, Number(cfg.scale || 1));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.set(0, 0, 72);

      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, premultipliedAlpha: false });
      renderer.setClearColor(0x000000, 0);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xbfd7ff, 0.9));
      const key = new THREE.DirectionalLight(0xffffff, 1.35);
      key.position.set(14, 20, 32);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x8fdcff, 0.9);
      rim.position.set(-24, 6, -14);
      scene.add(rim);
      const violet = new THREE.PointLight(0x8b5cf6, 1.2, 90);
      violet.position.set(-20, -8, 20);
      scene.add(violet);

      const voyagerGroup = new THREE.Group();
      const shipRollGroup = new THREE.Group();
      voyagerGroup.add(shipRollGroup);
      scene.add(voyagerGroup);

      // The Meshy Voyager model's single pointy end is treated as the nose/front.
      // If the model ever appears to fly backwards, change this by Math.PI.
      const NOSE_FORWARD_OFFSET = Math.PI;

      function viewportWorldSizeAtZ(z) {
        const distance = Math.abs(camera.position.z - z);
        const vFov = THREE.MathUtils.degToRad(camera.fov);
        const height = 2 * Math.tan(vFov / 2) * distance;
        return { height, width: height * camera.aspect };
      }

      function fitObject(root) {
        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        root.position.sub(center);
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const target = Math.min(viewportWorldSizeAtZ(0).width, viewportWorldSizeAtZ(0).height) * 0.19 * scaleMul;
        root.scale.setScalar(target / maxDim);
      }

      const payload = await window.voyagerHost.readModel();
      if (!payload.success) throw new Error(payload.error || 'Could not read model');
      setStatus('Loading Obsidian Voyager model…');
      const bytes = Uint8Array.from(atob(payload.base64), c => c.charCodeAt(0));
      const blob = new Blob([bytes], { type: 'model/gltf-binary' });
      const url = URL.createObjectURL(blob);
      const loader = new THREE.GLTFLoader();

      loader.load(url, (gltf) => {
        URL.revokeObjectURL(url);
        const ship = gltf.scene;
        ship.traverse((node) => {
          if (node.isMesh || node.isSkinnedMesh) {
            node.frustumCulled = false;
            node.castShadow = false;
            node.receiveShadow = false;
            const mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach((m) => {
              if (!m) return;
              m.transparent = m.opacity < 1;
              if (typeof m.metalness === 'number') m.metalness = Math.max(m.metalness, 0.45);
              if (typeof m.roughness === 'number') m.roughness = Math.min(Math.max(m.roughness, 0.28), 0.72);
              m.side = THREE.DoubleSide;
              m.needsUpdate = true;
            });
          }
        });
        fitObject(ship);
        shipRollGroup.add(ship);
        setStatus('Obsidian Voyager is flying. Right-click its tray icon to close.', true);
        animate();
      }, undefined, (err) => {
        setStatus('Voyager load failed: ' + (err && err.message ? err.message : err));
      });

      const clock = new THREE.Clock();
      let phase = Math.random() * 100;

      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime() * speedMul + phase;
        const bounds = viewportWorldSizeAtZ(0);
        const marginX = bounds.width * 0.39;
        const marginY = bounds.height * 0.10;

        // Stable horizontal forward-flight path.
        // The ship travels left/right across the desktop. It stays mostly level,
        // but occasionally dips a wing to reveal a different profile.
        const x = Math.sin(t * 0.09) * marginX;
        const y = Math.sin(t * 0.035 + 2.1) * marginY * 0.35;
        const z = Math.sin(t * 0.04 + 0.8) * 5;
        voyagerGroup.position.set(x, y, z);

        // Face the pointy nose in the direction of horizontal travel.  When x is
        // increasing the ship points right; when x is decreasing it points left.
        const dx = Math.cos(t * 0.09) * marginX * 0.09;
        const targetYaw = (dx >= 0 ? 0 : Math.PI) + NOSE_FORWARD_OFFSET;

        // A slow pulse creates occasional, smooth wing dips without changing the
        // horizontal travel direction. Most of the time this remains near zero.
        const dipPulse = Math.pow(Math.max(0, Math.sin(t * 0.115 + 1.4)), 8);
        const dipSide = Math.sin(t * 0.047 + 0.8) >= 0 ? 1 : -1;
        const targetRoll = dipSide * dipPulse * 0.58;
        const targetProfileYaw = Math.sin(t * 0.19 + 0.5) * dipPulse * 0.11;
        const targetProfilePitch = Math.sin(t * 0.17 + 2.2) * dipPulse * 0.06;

        voyagerGroup.rotation.y = THREE.MathUtils.lerp(voyagerGroup.rotation.y, targetYaw, 0.035);
        voyagerGroup.rotation.x = THREE.MathUtils.lerp(voyagerGroup.rotation.x, 0, 0.06);
        shipRollGroup.rotation.z = THREE.MathUtils.lerp(shipRollGroup.rotation.z, targetRoll, 0.035);
        shipRollGroup.rotation.y = THREE.MathUtils.lerp(shipRollGroup.rotation.y, targetProfileYaw, 0.04);
        shipRollGroup.rotation.x = THREE.MathUtils.lerp(shipRollGroup.rotation.x, targetProfilePitch, 0.04);

        violet.position.set(x - 10, y - 5, 18);
        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })().catch((error) => {
      const status = document.getElementById('status');
      status.textContent = 'Obsidian Voyager error: ' + (error && error.message ? error.message : error);
      console.error(error);
    });
  </script>
</body>
</html>
